name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Тесты (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Тесты
        run: |
          set -o pipefail
          python -m unittest discover -s hub/tests -t . 2>&1 | tee /tmp/tests.log

  lint:
    name: Линт (мёртвый код)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка
        run: pip install pyflakes vulture

      - name: pyflakes — неиспользуемые импорты и имена
        run: python -m pyflakes hub/*.py hub/tests/*.py

      - name: vulture — код, на который никто не ссылается
        run: python -m vulture hub/*.py --min-confidence 80
